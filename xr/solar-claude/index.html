<script type="module">
import { createXRApp, THREE, chime } from 'connect-xr';

const params = new URLSearchParams(location.search);
const RENDER = params.has('render');
document.documentElement.classList.toggle('render', RENDER);

const app = await createXRApp({ title: 'AI BUILD MASTER', subtitle: '', prefer: 'ar', hitTest: true, environment: false, background: 0x000000, cameraPos: [0, 1.45, 0.55], target: [0, 1.05, -0.75] });
const { scene, camera, renderer } = app;
app.controls.enabled = false;
renderer.localClippingEnabled = true;
renderer.toneMappingExposure = 1.0;
scene.add(camera); // the warp streaks ride on the camera
const SRC = await (await fetch(location.pathname)).text().catch(() => '');
const SRC_KB = Math.round(new Blob([SRC]).size / 1024);

// ---------------------------------------------------------------- small math
const TAU = Math.PI * 2;
const sm = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
function hash3(x, y, z) { let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(z, 1274126177); h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }

  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z), xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf), c = (a, b, d) => hash3(xi + a, yi + b, zi + d);
  return lerp(lerp(lerp(c(0, 0, 0), c(1, 0, 0), u), lerp(c(0, 1, 0), c(1, 1, 0), u), v), lerp(lerp(c(0, 0, 1), c(1, 0, 1), u), lerp(c(0, 1, 1), c(1, 1, 1), u), v), w);
}
function fbm(x, y, z, o = 5) { let s = 0, a = 0.5, f = 1, n = 0; for (let i = 0; i < o; i++) { s += a * vnoise(x * f, y * f, z * f); n += a; a *= 0.5; f *= 2.03; } return s / n; }

let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };

// equirectangular texture painted from a function of the point on the unit sphere (seamless: the noise is 3D)
function sphereTex(w, h, fn) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'), img = g.createImageData(w, h), d = img.data;
  for (let j = 0; j < h; j++) {
    const lat = (0.5 - (j + 0.5) / h) * Math.PI, cl = Math.cos(lat), sl = Math.sin(lat);
    for (let i = 0; i < w; i++) {
      const lon = ((i + 0.5) / w) * TAU, col = fn(cl * Math.cos(lon), sl, cl * Math.sin(lon), lat, lon), k = (j * w + i) * 4;
      d[k] = col[0]; d[k + 1] = col[1]; d[k + 2] = col[2]; d[k + 3] = col.length > 3 ? col[3] : 255;
    }
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}

// ---------------------------------------------------------------- planet textures (all procedural)
const earthTex = sphereTex(768, 384, (x, y, z, lat) => {
  const n = fbm(x * 1.7 + 5, y * 1.7, z * 1.7, 6), m = fbm(x * 4 + 11, y * 4, z * 4, 3);
  if (Math.abs(lat) > 1.2 - m * 0.18) return [236, 243, 250];
  if (n > 0.53) { const k = Math.min(1, (n - 0.53) / 0.16); const dry = Math.min(1, Math.max(0, m * 1.6 - 0.5 + (0.45 - Math.abs(Math.abs(lat) - 0.42)) * 0.8)); return mixc(mixc([52, 96, 46], [176, 146, 96], dry), [118, 104, 92], k * 0.6); }
  const dpt = Math.min(1, (0.53 - n) / 0.14); return mixc([36, 108, 160], [8, 30, 82], dpt);
});
const cloudTex = sphereTex(512, 256, (x, y, z) => { const a = sm(0.5, 0.72, fbm(x * 2.6 + 30, y * 3.4, z * 2.6, 5)); return [255, 255, 255, a * 235]; });
const craters = Array.from({ length: 70 }, () => { const u = rnd() * 2 - 1, a = rnd() * TAU, s = Math.sqrt(1 - u * u); return { x: s * Math.cos(a), y: u, z: s * Math.sin(a), r: 0.03 + rnd() * rnd() * 0.22 }; });
const moonTex = sphereTex(512, 256, (x, y, z) => {
  let v = 120 + fbm(x * 3, y * 3, z * 3, 5) * 90 - (fbm(x * 1.2 + 9, y * 1.2, z * 1.2, 3) > 0.58 ? 45 : 0);
  for (const c of craters) { const d = Math.acos(Math.min(1, x * c.x + y * c.y + z * c.z)); if (d < c.r * 1.25) v += d < c.r ? -22 * (1 - d / c.r) : 30 * (1 - (d - c.r) / (c.r * 0.25)); }
  v = Math.max(30, Math.min(235, v)); return [v, v * 0.98, v * 0.95];
});
const marsTex = sphereTex(512, 256, (x, y, z, lat) => {
  if (Math.abs(lat) > 1.32 - fbm(x * 5, y * 5, z * 5, 2) * 0.12) return [238, 226, 214];
  const n = fbm(x * 2.4 + 3, y * 2.4, z * 2.4, 6), m = fbm(x * 1.3 + 20, y * 1.3, z * 1.3, 3);
  return mixc(mixc([196, 96, 52], [222, 140, 86], n), [104, 52, 34], sm(0.55, 0.7, m) * 0.8);
});
const jupTex = sphereTex(1024, 512, (x, y, z, lat, lon) => {
  const turb = fbm(x * 3 + 1, y * 9, z * 3, 5);
  const b = Math.sin(lat * 15 + turb * 3.2) * 0.5 + 0.5, b2 = Math.sin(lat * 37 + turb * 5) * 0.5 + 0.5;
  let c = mixc(mixc([232, 220, 198], [194, 146, 104], b), [150, 98, 66], sm(0.75, 1, b2) * 0.5);
  if (Math.abs(lat) < 0.08) c = mixc(c, [242, 236, 222], 0.5);
  let dl = Math.abs(lon - 1.1); if (dl > Math.PI) dl = TAU - dl;
  const e = (dl / 0.3) ** 2 + ((lat + 0.39) / 0.12) ** 2;            // the Great Red Spot
  if (e < 1.35) { const sw = Math.sin(Math.atan2(lat + 0.39, dl) * 3 + e * 6 + turb * 4) * 0.5 + 0.5; c = mixc(c, mixc([196, 88, 58], [226, 150, 110], sw * 0.6), sm(1.35, 0.7, e)); }
  return c;
});
const satTex = sphereTex(512, 256, (x, y, z, lat) => { const t = fbm(x * 2, y * 7, z * 2, 4); const b = Math.sin(lat * 19 + t * 1.6) * 0.5 + 0.5; return mixc(mixc([236, 220, 178], [206, 178, 124], b), [176, 150, 106], sm(1.0, 1.4, Math.abs(lat)) * 0.6); });
const RING_IN = 165, RING_OUT = 300;
const ringTex = (() => {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 4; const g = c.getContext('2d');
  for (let i = 0; i < 1024; i++) {
    const u = i / 1023;
    let a = u < 0.12 ? u / 0.12 * 0.22 : u < 0.44 ? 0.75 + 0.2 * Math.sin(u * 160) : u < 0.52 ? 0.04 : u < 0.9 ? 0.55 + 0.15 * Math.sin(u * 220) : (1 - u) / 0.1 * 0.4;
    if (u > 0.82 && u < 0.835) a = 0.05;                                 // Encke gap
    a *= 0.85 + 0.15 * hash3(i, 3, 7);
    const k = u < 0.44 ? 1 : 0.88; g.fillStyle = `rgba(${226 * k | 0},${210 * k | 0},${178 * k | 0},${Math.max(0, a).toFixed(3)})`; g.fillRect(i, 0, 1, 4);
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
const glowTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'); const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.25, 'rgba(255,255,255,0.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 256, 256); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; })();

// ---------------------------------------------------------------- clipping for the wireframe scan (one plane, moved each frame)
const keepAll = new THREE.Plane(V3(0, 1, 0), 1e9), keepNone = new THREE.Plane(V3(0, 1, 0), -1e9);
const realPlane = keepAll.clone(), wirePlane = keepNone.clone();
const realMats = [], wireMats = [];
const real = (m) => { m.clippingPlanes = [realPlane]; realMats.push(m); return m; };
const WIRE = new THREE.Color(0.35, 0.95, 1.25);
const wireMat = (o = 0.85) => { const m = new THREE.LineBasicMaterial({ color: WIRE, transparent: true, opacity: o, toneMapped: false, clippingPlanes: [wirePlane] }); wireMats.push(m); return m; };
const wireMeshMat = (o = 0.7) => { const m = new THREE.MeshBasicMaterial({ color: WIRE, wireframe: true, transparent: true, opacity: o, toneMapped: false, clippingPlanes: [wirePlane] }); wireMats.push(m); return m; };
function latLong(r, nLon = 24, nLat = 14, seg = 72) { // CAD-style meridians and parallels
  const p = [];
  for (let i = 0; i < nLon; i++) { const a = (i / nLon) * TAU; for (let k = 0; k < seg; k++) { const b0 = (k / seg) * Math.PI, b1 = ((k + 1) / seg) * Math.PI; p.push(Math.sin(b0) * Math.cos(a) * r, Math.cos(b0) * r, Math.sin(b0) * Math.sin(a) * r, Math.sin(b1) * Math.cos(a) * r, Math.cos(b1) * r, Math.sin(b1) * Math.sin(a) * r); } }
  for (let j = 1; j < nLat; j++) { const b = (j / nLat) * Math.PI, y = Math.cos(b) * r, rr = Math.sin(b) * r; for (let k = 0; k < seg; k++) { const a0 = (k / seg) * TAU, a1 = ((k + 1) / seg) * TAU; p.push(Math.cos(a0) * rr, y, Math.sin(a0) * rr, Math.cos(a1) * rr, y, Math.sin(a1) * rr); } }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3)); return g;
}

// ---------------------------------------------------------------- the cinematic world
const world = new THREE.Group(); scene.add(world);
const wires = new THREE.Group(); world.add(wires); wires.visible = false;
const sunLight = new THREE.DirectionalLight(0xfff2e0, 3.2); sunLight.position.set(0.7, 0.5, 0.8); scene.add(sunLight, sunLight.target);
const hemi = new THREE.HemisphereLight(0x223355, 0x000000, 0.08); scene.add(hemi);
const sphere = new THREE.SphereGeometry(1, 96, 64);
const BODIES = [];
function body(name, ko, pos, r, mat, info) {
  const m = new THREE.Mesh(sphere, mat); m.position.copy(pos); m.scale.setScalar(r); world.add(m);
  const w = new THREE.LineSegments(latLong(1), wireMat()); w.position.copy(pos); w.scale.setScalar(r * 1.002); wires.add(w);
  const b = { name, ko, pos, r, mesh: m, wire: w, ...info }; BODIES.push(b); return b;
}
const earthMat = real(new THREE.MeshStandardMaterial({ map: earthTex, roughness: 0.75, metalness: 0.0 }));
const EARTH = body('EARTH', '지구', V3(-80, -100, -320), 120, earthMat, { km: 6371, dist: 0 });
const clouds = new THREE.Mesh(sphere, real(new THREE.MeshStandardMaterial({ map: cloudTex, transparent: true, depthWrite: false, roughness: 1 })));
clouds.position.copy(EARTH.pos); clouds.scale.setScalar(120 * 1.012); world.add(clouds);
const atmoMat = new THREE.ShaderMaterial({
  uniforms: { uColor: { value: new THREE.Color(0.3, 0.6, 1.0) }, uLight: { value: V3(0.7, 0.5, 0.8).normalize() }, uFade: { value: 1 } },
  vertexShader: 'varying vec3 vN; varying vec3 vV; varying vec3 vW; void main(){ vN = normalize(mat3(modelMatrix) * normal); vec4 w = modelMatrix * vec4(position,1.0); vW = w.xyz; vV = normalize(cameraPosition - w.xyz); gl_Position = projectionMatrix * viewMatrix * w; }',
  fragmentShader: 'uniform vec3 uColor; uniform vec3 uLight; uniform float uFade; varying vec3 vN; varying vec3 vV; void main(){ float f = pow(1.0 - abs(dot(vN, vV)), 3.0); float l = clamp(dot(vN, uLight) * 0.7 + 0.45, 0.0, 1.0); gl_FragColor = vec4(uColor * f * l * 1.9 * uFade, 1.0); }',
  transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.FrontSide,
});
const atmo = new THREE.Mesh(sphere, atmoMat); atmo.position.copy(EARTH.pos); atmo.scale.setScalar(120 * 1.06); world.add(atmo);
const MOON = body('MOON', '달', V3(90, 50, -700), 22, real(new THREE.MeshStandardMaterial({ map: moonTex, roughness: 0.95 })), { km: 1737, dist: 0.384 });
const MARS = body('MARS', '화성', V3(-70, 20, -1500), 40, real(new THREE.MeshStandardMaterial({ map: marsTex, roughness: 0.9 })), { km: 3390, dist: 78.3 });
const JUPITER = body('JUPITER', '목성', V3(200, -30, -3100), 190, real(new THREE.MeshStandardMaterial({ map: jupTex, roughness: 0.85 })), { km: 69911, dist: 628.7, note: 'GREAT RED SPOT' });
JUPITER.mesh.rotation.z = 0.05;

// Saturn: the ring plane faces the flight path so the camera dives through the Cassini division
const SAT_POS = V3(-60, 0, -4100), SAT_N = V3(0.18, 0.34, 0.92).normalize();
const SATURN = body('SATURN', '토성', SAT_POS, 120, real(new THREE.MeshStandardMaterial({ map: satTex, roughness: 0.85 })), { km: 58232, dist: 1275, note: 'RING ICE ×220' });
const satFrame = new THREE.Group(); satFrame.position.copy(SAT_POS); satFrame.quaternion.setFromUnitVectors(V3(0, 1, 0), SAT_N); world.add(satFrame);
SATURN.mesh.quaternion.copy(satFrame.quaternion); SATURN.wire.quaternion.copy(satFrame.quaternion);
const ringGeo = new THREE.RingGeometry(RING_IN, RING_OUT, 160, 1).rotateX(-Math.PI / 2);
{ const p = ringGeo.attributes.position, uv = ringGeo.attributes.uv; for (let i = 0; i < p.count; i++) uv.setXY(i, (Math.hypot(p.getX(i), p.getZ(i)) - RING_IN) / (RING_OUT - RING_IN), 0.5); }
const ringMat = real(new THREE.MeshStandardMaterial({ map: ringTex, transparent: true, side: THREE.DoubleSide, depthWrite: false, roughness: 0.8, emissive: 0x1a1610, emissiveMap: ringTex }));
satFrame.add(new THREE.Mesh(ringGeo, ringMat));
{ // ring wireframe: concentric circles + spokes
  const p = []; for (let r = RING_IN; r <= RING_OUT; r += 15) for (let k = 0; k < 120; k++) { const a0 = (k / 120) * TAU, a1 = ((k + 1) / 120) * TAU; p.push(Math.cos(a0) * r, 0, Math.sin(a0) * r, Math.cos(a1) * r, 0, Math.sin(a1) * r); }
  for (let k = 0; k < 48; k++) { const a = (k / 48) * TAU; p.push(Math.cos(a) * RING_IN, 0, Math.sin(a) * RING_IN, Math.cos(a) * RING_OUT, 0, Math.sin(a) * RING_OUT); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
  const w = new THREE.LineSegments(g, wireMat(0.55)); w.position.copy(SAT_POS); w.quaternion.copy(satFrame.quaternion); wires.add(w);
}
// where the camera crosses the ring plane (radius 230 = the Cassini division)
const PASS_LOCAL = V3(0, 0, -1).multiplyScalar(230); // in ring-plane coordinates
const PASS = PASS_LOCAL.clone().applyQuaternion(satFrame.quaternion).add(SAT_POS);

// ▼ CODE SHOWCASE — 220 ice particles of Saturn's ring, in one draw call
const ICE_N = 220;
const iceGeo = new THREE.IcosahedronGeometry(1, 0);
const ice = new THREE.InstancedMesh(iceGeo, real(new THREE.MeshStandardMaterial({ color: 0xe6f2ff, roughness: 0.25, metalness: 0.1, emissive: 0x2a3d55, flatShading: true })), ICE_N);
const iceData = [];
for (let i = 0; i < ICE_N; i++) {
  const near = i < 160, a = rnd() * TAU, d = near ? 5 + rnd() * 55 : 0, rr = RING_IN + rnd() * (RING_OUT - RING_IN);
  const p = near ? PASS_LOCAL.clone().add(V3(Math.cos(a) * d, (rnd() - 0.5) * 8, Math.sin(a) * d)) : V3(Math.cos(a) * rr, (rnd() - 0.5) * 3, Math.sin(a) * rr);

}
satFrame.add(ice);
// ▲ CODE SHOWCASE
const iceWire = new THREE.InstancedMesh(iceGeo, wireMeshMat(0.9), ICE_N); satFrame.add(iceWire); wires.userData.ice = iceWire;

// asteroid belt: 180 rocks around the flight path between Mars and Jupiter
const AST_N = 180, astGeo = new THREE.IcosahedronGeometry(1, 1);
{ const p = astGeo.attributes.position; for (let i = 0; i < p.count; i++) { const v = V3(p.getX(i), p.getY(i), p.getZ(i)); v.multiplyScalar(0.72 + fbm(v.x * 1.7 + 4, v.y * 1.7, v.z * 1.7, 3) * 0.6); p.setXYZ(i, v.x, v.y, v.z); } astGeo.computeVertexNormals(); }
const asteroids = new THREE.InstancedMesh(astGeo, real(new THREE.MeshStandardMaterial({ color: 0x8a7e72, roughness: 0.95, flatShading: true })), AST_N);
const astWire = new THREE.InstancedMesh(astGeo, wireMeshMat(0.6), AST_N); wires.add(astWire);
const astData = [];
for (let i = 0; i < AST_N; i++) {
  const z = -1980 - rnd() * 460, a = rnd() * TAU, d = 9 + Math.pow(rnd(), 1.6) * 120;
  astData.push({ p: V3(Math.cos(a) * d + 5, Math.sin(a) * d * 0.7, z), s: V3(1 + rnd() * 0.6, 1 + rnd() * 0.6, 1 + rnd() * 0.6).multiplyScalar(1.2 + rnd() * rnd() * 9), spin: V3(rnd(), rnd(), rnd()).multiplyScalar(1.5) });
  asteroids.setColorAt(i, new THREE.Color().setHSL(0.07, 0.12 + rnd() * 0.1, 0.32 + rnd() * 0.2));
}
world.add(asteroids);

// the Sun: boiling surface shader + two corona layers + prominences (far away from the planets: we jump there)
const SUN_POS = V3(0, 0, -12000), SUN_R = 700;
const NOISE_GLSL = `
  float h3(vec3 p){ p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }

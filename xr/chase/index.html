  <nav class="abm-site" aria-label="AI Build Master"><a href="../../index.html">← ABM 홈</a><a href="../../xr-guide.html">따라하기 가이드</a><a href="../chase-claude/">Claude판으로 보기</a><a class="kit" href="../../kit.html?utm_source=xr&utm_campaign=chase">무료 키트</a></nav>
<script type="module">
    import { createXRApp, THREE } from 'connect-xr';

    // ---------- URL mode ----------
    const params = new URLSearchParams(location.search);
    const CAPTURE_MODE = params.get('capture') === '1';
    const SHORTS_CAPTIONS = CAPTURE_MODE || params.get('shorts') === '1';
    const CAP_W = Math.max(320, Number(params.get('w')) || 1080);
    const CAP_H = Math.max(320, Number(params.get('h')) || 1920);
    const DURATION = 30.0;

    if (CAPTURE_MODE) document.body.classList.add('capture-mode');

    // ---------- Math helpers ----------
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const lerp = (a, b, t) => a + (b - a) * t;
    const smoothstep = (e0, e1, x) => {
      const t = clamp((x - e0) / (e1 - e0), 0, 1);
      return t * t * (3 - 2 * t);
    };
    const smootherstep = (e0, e1, x) => {
      const t = clamp((x - e0) / (e1 - e0), 0, 1);
      return t * t * t * (t * (t * 6 - 15) + 10);
    };
    function seededRand(seed) {
      let s = seed >>> 0;
      return () => {
        s = (s * 1664525 + 1013904223) >>> 0;
        return s / 4294967296;
      };
    }

    // ---------- Init CONNECT AI XR app ----------
    const app = await createXRApp({
      title: 'AI BUILD MASTER · Urban Chase',
      prefer: 'vr',
      cameraPos: [7.5, 9.5, 16],
      target: [0, 1.4, -18],
      environment: 0.45,
      background: 0x050915,
    });

    const { scene, camera, renderer, controls } = app;
    camera.near = 0.04;
    camera.far = 460;
    camera.updateProjectionMatrix();

    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;

    if (CAPTURE_MODE) {
      controls.enabled = false;
      renderer.setPixelRatio(1);
      renderer.setSize(CAP_W, CAP_H, false);
      renderer.domElement.style.width = CAP_W + 'px';
      renderer.domElement.style.height = CAP_H + 'px';
      camera.aspect = CAP_W / CAP_H;
      camera.updateProjectionMatrix();
    }

    scene.fog = new THREE.FogExp2(0x050a18, 0.0062);

    // ---------- Procedural Canvas Textures ----------
    function makeSoftGlowTexture(innerHex, outerHex = 'rgba(0,0,0,0)') {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      const g = c.getContext('2d');
      const grad = g.createRadialGradient(128, 128, 6, 128, 128, 124);
      grad.addColorStop(0.0, innerHex);
      grad.addColorStop(0.35, innerHex.replace(/[\d.]+\)$/, '0.45)'));
      grad.addColorStop(0.75, innerHex.replace(/[\d.]+\)$/, '0.10)'));
      grad.addColorStop(1.0, outerHex);
      g.fillStyle = grad;
      g.fillRect(0, 0, 256, 256);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function makeHeadlightBeamTexture() {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 512;
      const g = c.getContext('2d');
      const grad = g.createLinearGradient(128, 512, 128, 0);
      grad.addColorStop(0.0, 'rgba(215, 244, 255, 0.85)');
      grad.addColorStop(0.35, 'rgba(155, 224, 255, 0.36)');
      grad.addColorStop(0.78, 'rgba(90, 175, 255, 0.08)');
      grad.addColorStop(1.0, 'rgba(60, 130, 255, 0.0)');
      g.fillStyle = grad;
      // Tapered cone mask
      g.beginPath();
      g.moveTo(100, 512);
      g.lineTo(156, 512);
      g.lineTo(250, 0);
      g.lineTo(6, 0);
      g.closePath();
      g.fill();
      // Soft horizontal feathering
      g.globalCompositeOperation = 'destination-in';
      const sideGrad = g.createLinearGradient(0, 0, 256, 0);
      sideGrad.addColorStop(0.0, 'rgba(0,0,0,0)');
      sideGrad.addColorStop(0.28, 'rgba(0,0,0,1)');
      sideGrad.addColorStop(0.72, 'rgba(0,0,0,1)');
      sideGrad.addColorStop(1.0, 'rgba(0,0,0,0)');
      g.fillStyle = sideGrad;
      g.fillRect(0, 0, 256, 512);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function makeRoadTexture() {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 1024;
      const g = c.getContext('2d');
      g.fillStyle = '#0b0e17';
      g.fillRect(0, 0, 512, 1024);
      const rand = seededRand(42);
      for (let i = 0; i < 1100; i++) {
        const x = rand() * 512, y = rand() * 1024;
        const v = 10 + Math.floor(rand() * 20);
        g.fillStyle = `rgba(${v},${v + 5},${v + 14},0.38)`;
        g.fillRect(x, y, 2 + rand() * 4, 14 + rand() * 52);
      }
      for (let lane = 0; lane < 6; lane++) {
        const cx = (lane + 0.5) * (512 / 6);
        g.fillStyle = 'rgba(3,5,10,0.6)';
        g.fillRect(cx - 20, 0, 12, 1024);
        g.fillRect(cx + 8, 0, 12, 1024);
      }
      g.fillStyle = '#e2b963';
      g.fillRect(10, 0, 6, 1024);
      g.fillRect(496, 0, 6, 1024);
      g.fillStyle = '#f5a623';
      g.fillRect(250, 0, 4, 1024);
      g.fillRect(258, 0, 4, 1024);
      g.fillStyle = 'rgba(225,240,255,0.85)';
      const laneX = [512 / 6, (512 * 2) / 6, (512 * 4) / 6, (512 * 5) / 6];
      for (const x of laneX) {
        for (let y = 24; y < 1024; y += 128) g.fillRect(x - 2.5, y, 5, 62);
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(1, 24);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      return tex;
    }

    function makeBuildingTextures() {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 1024;
      const g = c.getContext('2d');
      const e = document.createElement('canvas');
      e.width = 512; e.height = 1024;
      const eg = e.getContext('2d');
      g.fillStyle = '#080d18';
      g.fillRect(0, 0, 512, 1024);
      eg.fillStyle = '#000000';
      eg.fillRect(0, 0, 512, 1024);
      const rand = seededRand(991);
      const cols = 16, rows = 44;
      const cw = 512 / cols, rh = 1024 / rows;
      for (let r = 0; r < rows; r++) {
        const floorLitBias = rand();
        for (let col = 0; col < cols; col++) {
          const x = col * cw + 3, y = r * rh + 4;
          const w = cw - 6, h = rh - 8;
          g.fillStyle = '#111b2e';
          g.fillRect(x, y, w, h);
          if (rand() < 0.28 + floorLitBias * 0.25) {
            const palette = rand();
            let colHex = '#ffd78c';
            if (palette < 0.38) colHex = '#4ce3ff';
            else if (palette < 0.68) colHex = '#ffbe5c';
            else if (palette < 0.88) colHex = '#dceeff';
            else colHex = '#ff5c4a';
            const alpha = 0.45 + rand() * 0.55;
            eg.fillStyle = colHex;
            eg.globalAlpha = alpha;
            eg.fillRect(x + 1, y + 1, w - 2, h - 2);
            g.fillStyle = colHex;
            g.globalAlpha = alpha * 0.7;
            g.fillRect(x + 1, y + 1, w - 2, h - 2);
          }
        }
      }
      eg.globalAlpha = 1;
      g.globalAlpha = 1;
      for (const bandY of [180, 520, 860]) {
        eg.fillStyle = bandY === 520 ? '#ff9d2e' : '#29d8ff';
        eg.fillRect(0, bandY, 512, 5);
      }
      const map = new THREE.CanvasTexture(c);
      map.wrapS = map.wrapT = THREE.RepeatWrapping;
      map.colorSpace = THREE.SRGBColorSpace;
      const emissiveMap = new THREE.CanvasTexture(e);
      emissiveMap.wrapS = emissiveMap.wrapT = THREE.RepeatWrapping;
      emissiveMap.colorSpace = THREE.SRGBColorSpace;
      return { map, emissiveMap };
    }

    function makeSkyTexture() {
      const c = document.createElement('canvas');
      c.width = 64; c.height = 512;
      const g = c.getContext('2d');
      const grad = g.createLinearGradient(0, 0, 0, 512);
      grad.addColorStop(0.0, '#02040a');
      grad.addColorStop(0.45, '#060f22');
      grad.addColorStop(0.72, '#0e1f3e');
      grad.addColorStop(0.86, '#1c2b4a');
      grad.addColorStop(0.94, '#2d2338');
      grad.addColorStop(1.0, '#050812');
      g.fillStyle = grad;
      g.fillRect(0, 0, 64, 512);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // ---------- Lighting ----------
    scene.add(new THREE.HemisphereLight(0x5280c4, 0x090c14, 0.95));
    const moonDir = new THREE.DirectionalLight(0xa4ccff, 1.35);
    moonDir.position.set(24, 55, 18);
    scene.add(moonDir);
    const warmRim = new THREE.DirectionalLight(0xffa43c, 0.95);
    warmRim.position.set(-28, 22, -36);
    scene.add(warmRim);

    const skyDome = new THREE.Mesh(
      new THREE.SphereGeometry(400, 24, 16),
      new THREE.MeshBasicMaterial({ map: makeSkyTexture(), side: THREE.BackSide, fog: false })
    );
    scene.add(skyDome);

    // Soft radial horizon city aura (no hard rectangle edges!)
    const horizonGlow = new THREE.Mesh(
      new THREE.PlaneGeometry(320, 140),
      new THREE.MeshBasicMaterial({
        map: makeSoftGlowTexture('rgba(56, 130, 235, 0.65)'),
        transparent: true, opacity: 0.72, fog: false,
        blending: THREE.AdditiveBlending, depthWrite: false
      })
    );
    scene.add(horizonGlow);

    // ---------- Infinite Wrapping City World ----------
    const LOOP_LEN = 480;
    const ROAD_W = 26;
    const cityRoot = new THREE.Group();
    scene.add(cityRoot);

    const roadTex = makeRoadTexture();
    const roadMat = new THREE.MeshStandardMaterial({ map: roadTex, roughness: 0.2, metalness: 0.42 });
    const roadMesh = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_W, LOOP_LEN * 2), roadMat);
    roadMesh.rotation.x = -Math.PI / 2;
    cityRoot.add(roadMesh);

    const curbMat = new THREE.MeshStandardMaterial({ color: 0x141b2b, roughness: 0.5, metalness: 0.4 });
    const leftWalk = new THREE.Mesh(new THREE.BoxGeometry(18, 0.45, LOOP_LEN * 2), curbMat);
    leftWalk.position.set(-(ROAD_W / 2 + 9), 0.22, 0);
    const rightWalk = leftWalk.clone();
    rightWalk.position.x = ROAD_W / 2 + 9;
    cityRoot.add(leftWalk, rightWalk);

    const railL = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.14, LOOP_LEN * 2), new THREE.MeshBasicMaterial({ color: 0x2de2ff }));
    railL.position.set(-ROAD_W / 2 - 0.15, 0.62, 0);
    const railR = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.14, LOOP_LEN * 2), new THREE.MeshBasicMaterial({ color: 0xffa62e }));
    railR.position.set(ROAD_W / 2 + 0.15, 0.62, 0);
    cityRoot.add(railL, railR);

    // Skyscrapers via InstancedMesh
    const { map: bldgMap, emissiveMap: bldgEmissive } = makeBuildingTextures();
    const bldgMat = new THREE.MeshStandardMaterial({
      map: bldgMap, emissive: new THREE.Color(0xffffff), emissiveMap: bldgEmissive,
      emissiveIntensity: 1.5, roughness: 0.26, metalness: 0.58,
    });
    const BLDG_COUNT = 180;
    const bldgMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), bldgMat, BLDG_COUNT);
    const randB = seededRand(2026);
    const bldgData = [];
    const dummy = new THREE.Object3D();
    const tmpColor = new THREE.Color();

    for (let i = 0; i < BLDG_COUNT; i++) {
      const side = i % 2 === 0 ? -1 : 1;
      const tier = i % 3 === 0 ? 1 : 0;
      const w = 8 + randB() * 14;
      const d = 10 + randB() * 16;
      const h = tier === 0 ? (28 + randB() * 68) : (60 + randB() * 100);
      const x = side * (ROAD_W / 2 + 6 + w * 0.5 + tier * 16 + randB() * 4);
      const z = -LOOP_LEN + (i / BLDG_COUNT) * (LOOP_LEN * 2);
      bldgData.push({ x, y: h * 0.5, z, w, h, d });
      dummy.position.set(x, h * 0.5, z);
      dummy.scale.set(w, h, d);
      dummy.rotation.set(0, 0, 0);
      dummy.updateMatrix();
      bldgMesh.setMatrixAt(i, dummy.matrix);
      const tint = randB();
      if (tint < 0.35) tmpColor.setRGB(0.85, 0.94, 1.05);
      else if (tint < 0.7) tmpColor.setRGB(1.05, 0.92, 0.78);
      else tmpColor.setRGB(0.75, 0.85, 1.0);
      bldgMesh.setColorAt(i, tmpColor);
    }
    bldgMesh.instanceMatrix.needsUpdate = true;
    bldgMesh.instanceColor.needsUpdate = true;
    cityRoot.add(bldgMesh);

    // Vertical Neon Accent Strips
    const neonStripCount = 96;
    const neonStripMesh = new THREE.InstancedMesh(
      new THREE.BoxGeometry(0.42, 1, 0.42),
      new THREE.MeshBasicMaterial({ color: 0xffffff }),
      neonStripCount
    );
    const neonPalette = [0x26e6ff, 0xffaa2b, 0xff2e63, 0x45ffbc, 0x7b61ff];
    for (let i = 0; i < neonStripCount; i++) {
      const b = bldgData[i % BLDG_COUNT];
      const side = b.x < 0 ? 1 : -1;
      const sh = b.h * (0.45 + randB() * 0.45);
      dummy.position.set(b.x + side * (b.w * 0.5 + 0.15), sh * 0.5 + 4, b.z + (randB() - 0.5) * b.d * 0.6);
      dummy.scale.set(1, sh, 1);
      dummy.rotation.set(0, 0, 0);
      dummy.updateMatrix();
      neonStripMesh.setMatrixAt(i, dummy.matrix);
      tmpColor.setHex(neonPalette[i % neonPalette.length]);
      neonStripMesh.setColorAt(i, tmpColor);
    }
    neonStripMesh.instanceMatrix.needsUpdate = true;
    neonStripMesh.instanceColor.needsUpdate = true;
    cityRoot.add(neonStripMesh);

    // Overhead Highway Gantries
    const GANTRY_SPACING = 40;
    const GANTRY_COUNT = Math.floor((LOOP_LEN * 2) / GANTRY_SPACING);
    const gantryPillarMesh = new THREE.InstancedMesh(
      new THREE.BoxGeometry(0.7, 10.5, 0.7),
      new THREE.MeshStandardMaterial({ color: 0x1c2538, metalness: 0.7, roughness: 0.3 }),
      GANTRY_COUNT * 2
    );
    const gantryBeamMesh = new THREE.InstancedMesh(
      new THREE.BoxGeometry(ROAD_W + 2.4, 0.75, 1.1),
      new THREE.MeshStandardMaterial({ color: 0x182032, metalness: 0.75, roughness: 0.25 }),
      GANTRY_COUNT
    );
    const gantryLightMesh = new THREE.InstancedMesh(
      new THREE.BoxGeometry(ROAD_W + 0.8, 0.18, 0.28),
      new THREE.MeshBasicMaterial({ color: 0xffffff }),
      GANTRY_COUNT
    );
    for (let i = 0; i < GANTRY_COUNT; i++) {
      const z = -LOOP_LEN + i * GANTRY_SPACING;
      dummy.scale.set(1, 1, 1);
      dummy.position.set(-(ROAD_W / 2 + 1.0), 5.25, z); dummy.updateMatrix(); gantryPillarMesh.setMatrixAt(i * 2, dummy.matrix);
      dummy.position.set(ROAD_W / 2 + 1.0, 5.25, z); dummy.updateMatrix(); gantryPillarMesh.setMatrixAt(i * 2 + 1, dummy.matrix);
      dummy.position.set(0, 10.2, z); dummy.updateMatrix(); gantryBeamMesh.setMatrixAt(i, dummy.matrix);
      dummy.position.set(0, 9.75, z); dummy.updateMatrix(); gantryLightMesh.setMatrixAt(i, dummy.matrix);
      tmpColor.setHex(i % 3 === 0 ? 0xffaa2e : 0x35e6ff);
      gantryLightMesh.setColorAt(i, tmpColor);
    }
    gantryPillarMesh.instanceMatrix.needsUpdate = true;
    gantryBeamMesh.instanceMatrix.needsUpdate = true;
    gantryLightMesh.instanceMatrix.needsUpdate = true;
    gantryLightMesh.instanceColor.needsUpdate = true;
    cityRoot.add(gantryPillarMesh, gantryBeamMesh, gantryLightMesh);

    // Streetlamps
    const LAMP_SPACING = 20;
    const LAMP_COUNT = Math.floor((LOOP_LEN * 2) / LAMP_SPACING);
    const lampHeadMesh = new THREE.InstancedMesh(
      new THREE.BoxGeometry(1.4, 0.14, 0.45),
      new THREE.MeshBasicMaterial({ color: 0xffe4b5 }),
      LAMP_COUNT * 2
    );
    for (let i = 0; i < LAMP_COUNT; i++) {
      const z = -LOOP_LEN + i * LAMP_SPACING + 10;
      dummy.scale.set(1, 1, 1);
      dummy.position.set(-(ROAD_W / 2 - 0.6), 7.8, z); dummy.updateMatrix(); lampHeadMesh.setMatrixAt(i * 2, dummy.matrix);
      dummy.position.set(ROAD_W / 2 - 0.6, 7.8, z); dummy.updateMatrix(); lampHeadMesh.setMatrixAt(i * 2 + 1, dummy.matrix);
    }
    lampHeadMesh.instanceMatrix.needsUpdate = true;
    cityRoot.add(lampHeadMesh);

    // ---------- Vehicle Builders ----------
    const beamTex = makeHeadlightBeamTexture();
    const underGlowTex = makeSoftGlowTexture('rgba(235, 152, 42, 0.85)');

    function buildHeroCar() {
      const root = new THREE.Group();
      const exteriorShell = new THREE.Group();
      root.add(exteriorShell);

      const carbonMat = new THREE.MeshStandardMaterial({ color: 0x0f1420, metalness: 0.88, roughness: 0.2 });
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1a2438, metalness: 0.92, roughness: 0.14 });
      const goldMat = new THREE.MeshStandardMaterial({ color: 0xf0a63a, metalness: 0.95, roughness: 0.18, emissive: 0x6b3f08, emissiveIntensity: 0.4 });
      const glassMat = new THREE.MeshPhysicalMaterial({ color: 0x0c1b30, metalness: 0.25, roughness: 0.06, transparent: true, opacity: 0.68 });
      const headMat = new THREE.MeshBasicMaterial({ color: 0xf0fbff });
      const tailMat = new THREE.MeshBasicMaterial({ color: 0xff1a3c });

      // Lower chassis
      const lower = new THREE.Mesh(new THREE.BoxGeometry(2.18, 0.46, 4.82), carbonMat);
      lower.position.set(0, 0.48, 0);
      root.add(lower);

      // Sculpted hood (visible both exterior & from driver POV)
      const hood = new THREE.Mesh(new THREE.BoxGeometry(1.94, 0.22, 1.88), bodyMat);
      hood.position.set(0, 0.77, -1.36);
      hood.rotation.x = 0.08;
      root.add(hood);

      const hoodLineL = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.025, 1.65), goldMat);
      hoodLineL.position.set(-0.62, 0.89, -1.36);
      hoodLineL.rotation.x = 0.08;
      const hoodLineR = hoodLineL.clone();
      hoodLineR.position.x = 0.62;
      root.add(hoodLineL, hoodLineR);

      // Fenders
      const fenderGeo = new THREE.BoxGeometry(0.42, 0.32, 4.48);
      const fenderL = new THREE.Mesh(fenderGeo, bodyMat);
      fenderL.position.set(-0.92, 0.74, -0.05);
      const fenderR = fenderL.clone();
      fenderR.position.x = 0.92;
      root.add(fenderL, fenderR);

      // Sleek exterior fastback cabin & GT wing (hidden when inside cockpit)
      const canopy = new THREE.Mesh(new THREE.BoxGeometry(1.62, 0.44, 1.98), glassMat);
      canopy.position.set(0, 1.06, 0.14);
      const roof = new THREE.Mesh(new THREE.BoxGeometry(1.48, 0.07, 1.38), carbonMat);
      roof.position.set(0, 1.30, 0.18);
      const roofStripe = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.075, 1.39), goldMat);
      roofStripe.position.set(0, 1.305, 0.18);
      const rearDeck = new THREE.Mesh(new THREE.BoxGeometry(1.92, 0.36, 1.5), bodyMat);
      rearDeck.position.set(0, 0.88, 1.52);
      const wingBlade = new THREE.Mesh(new THREE.BoxGeometry(2.30, 0.06, 0.38), carbonMat);
      wingBlade.position.set(0, 1.24, 2.22);

    function drawRoundedRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function projectToCanvas(worldVec, W, H) {
      const v = worldVec.clone().project(camera);
      if (v.z < -1 || v.z > 1) return null;
      return { x: (v.x * 0.5 + 0.5) * W, y: (-v.y * 0.5 + 0.5) * H, z: v.z };
    }

    function drawBracketCallout(ctx, pt, color, title, detail, alignRight = true, pulse = 1) {
      if (!pt || pt.x < 40 || pt.x > 1040 || pt.y < 140 || pt.y > 1760) return;
      const s = 26 + Math.sin(pulse * 8) * 3;
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = 3;

      // Animated corner brackets around 3D tracked object
      const cs = 10;
      for (const [dx, dy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
        ctx.beginPath();
        ctx.moveTo(pt.x + dx * s, pt.y + dy * (s - cs));
        ctx.lineTo(pt.x + dx * s, pt.y + dy * s);
        ctx.lineTo(pt.x + dx * (s - cs), pt.y + dy * s);
        ctx.stroke();
      }

      // Leader line -> telemetry tag
      const dir = alignRight ? 1 : -1;
      const elbowX = clamp(pt.x + dir * 72, 70, 1010);
      const elbowY = clamp(pt.y - 54, 420, 1650);
      const boxW = 248, boxH = 66;
      const boxX = dir > 0 ? Math.min(elbowX, 1040 - boxW) : Math.max(elbowX - boxW, 40);
      const boxY = elbowY - boxH / 2;

      ctx.beginPath();
      ctx.moveTo(pt.x + dir * s, pt.y - s * 0.6);
      ctx.lineTo(elbowX, elbowY);
      ctx.stroke();

      // Glow dot at anchor
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, 4, 0, Math.PI * 2);
      ctx.fill();

      // Translucent tactical data plate
      drawRoundedRect(ctx, boxX, boxY, boxW, boxH, 8);
      ctx.fillStyle = 'rgba(5, 11, 24, 0.76)';
      ctx.fill();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.stroke();

      // Accent bar on left edge
      ctx.fillStyle = color;
      ctx.fillRect(boxX, boxY, 5, boxH);

      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = color;
      ctx.font = '800 18px ui-monospace, Consolas, monospace';
      ctx.fillText(title, boxX + 14, boxY + 21);

      ctx.fillStyle = '#E8F4FF';
      ctx.font = '700 20px ui-monospace, Consolas, monospace';
      ctx.fillText(detail, boxX + 14, boxY + 46);
      ctx.restore();
    }

      ctx.fillStyle = '#36E8FF';
      ctx.fillText(insideCockpit ? 'AR-HUD // COCKPIT LINK' : 'DRONE CAM // LIVE TRACK', 96, 103);

      ctx.textAlign = 'right';
      ctx.fillStyle = '#F2B45A';
      const gForce = (1.0 + Math.abs(vx) * 0.24).toFixed(2);
      ctx.fillText(`${Math.round(kmh)} KM/H  |  ${gForce}G  |  REC 00:${String(Math.floor(t)).padStart(2, '0')}`, 1012, 103);

      // --- B) 3D-Projected Live Vehicle Callouts ---
      if (!insideCockpit) {
        // Track Hero Supercar in 3D space
        const hPt = projectToCanvas(heroPos.clone().add(new THREE.Vector3(0, 1.35, 0)), W, H);
        drawBracketCallout(
          ctx, hPt, '#F2B45A',
          'TARGET 01 // ABM-GT',
          `${Math.round(kmh)} KM/H · DRIFT ${Math.abs(vx * 3.1).toFixed(0)}°`,
          (hPt?.x ?? 500) < 540, t
        );

        // Track Police Interceptor 1
        const p1Pt = projectToCanvas(p1Pos.clone().add(new THREE.Vector3(0, 1.5, 0)), W, H);
        const d1 = p1Pos.distanceTo(heroPos).toFixed(1);
        drawBracketCallout(
          ctx, p1Pt, '#FF3355',
          'PURSUIT // UNIT-01',
          `DIST ${d1}m · CLOSING ▲`,
          (p1Pt?.x ?? 500) < 540, t + 0.3
        );

        // Track Nearest Traffic Obstacle if visible ahead
        if (nearestObstacle && nearestDist < 65) {
          const oPt = projectToCanvas(nearestObstacle.clone().add(new THREE.Vector3(0, 1.2, 0)), W, H);
          drawBracketCallout(
            ctx, oPt, '#36E8FF',
            'TRAFFIC // OBSTACLE',
            `GAP ${nearestDist.toFixed(0)}m · EVADE`,
            (oPt?.x ?? 500) < 540, t + 0.6
          );
        }
      } else {
        // --- C) Cockpit AR Fighter-Jet / JARVIS Windshield Graphics ---
        // 1. Center horizon pitch ladder & dynamic G-vector reticle
        const cx = W * 0.5, cy = H * 0.44;
        const roll = clamp(vx * 0.025, -0.14, 0.14);
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(roll);
        ctx.strokeStyle = 'rgba(54, 232, 255, 0.55)';
        ctx.lineWidth = 2.5;
        // Left & right horizon wings
        ctx.beginPath();
        ctx.moveTo(-220, 0); ctx.lineTo(-95, 0); ctx.lineTo(-95, 16);
        ctx.moveTo(220, 0); ctx.lineTo(95, 0); ctx.lineTo(95, 16);
        ctx.stroke();
        // Speed arcs around center reticle
        const spdRatio = clamp((kmh - 220) / 130, 0.1, 1);
        ctx.strokeStyle = 'rgba(242, 180, 90, 0.78)';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(0, 0, 150, Math.PI * 0.72, Math.PI * (0.72 + spdRatio * 0.56));
        ctx.stroke();
        ctx.strokeStyle = 'rgba(54, 232, 255, 0.78)';
        ctx.beginPath();
        ctx.arc(0, 0, 150, -Math.PI * 0.28, Math.PI * (-0.28 + spdRatio * 0.56));
        ctx.stroke();
        ctx.restore();

        // 2. Live 3D-tracked obstacle bracket right through the windshield!
        if (nearestObstacle && nearestDist < 85) {
          const oPt = projectToCanvas(nearestObstacle.clone().add(new THREE.Vector3(0, 1.1, 0)), W, H);
          drawBracketCallout(
            ctx, oPt, nearestDist < 26 ? '#FF3355' : '#36E8FF',
            nearestDist < 26 ? 'WARN // COLLISION RISK' : 'LIDAR // VEHICLE',
            `${nearestDist.toFixed(0)}m · AUTO-EVADE`,
            (oPt?.x ?? 500) < 540, t
          );
        }

        // 3. JARVIS-style AI Copilot live tactical voice-briefing ticker
        const jMsg = nearestDist < 28
          ? `AI COPILOT // 전방 ${nearestDist.toFixed(0)}m 장애물 감지 · 즉시 차선 변경`
          : (t < 20.5
            ? `AI COPILOT // 운전석 링크 완료 · 후방 경찰차 2대 추적 중`
            : `AI COPILOT // 최고 속도 ${Math.round(kmh)}km/h · 탈출 벡터 고정`);
        ctx.save();
        drawRoundedRect(ctx, 130, 415, 820, 56, 28);
        ctx.fillStyle = 'rgba(4, 14, 30, 0.72)';
        ctx.fill();
        ctx.strokeStyle = nearestDist < 28 ? 'rgba(255, 58, 92, 0.8)' : 'rgba(54, 232, 255, 0.75)';
        ctx.lineWidth = 2;
        ctx.stroke();
        // Pulsing JARVIS core orb
        ctx.fillStyle = nearestDist < 28 ? '#FF385C' : '#36E8FF';
        ctx.beginPath(); ctx.arc(166, 443, 9 + Math.sin(t * 16) * 2.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#E8F7FF';
        ctx.font = '700 24px "Malgun Gothic", "Segoe UI", sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(jMsg, 192, 444);
        ctx.restore();
      }

      // --- D) Bottom-Right Live 6-Lane Mini Tactical Radar (always active in action acts!) ---
      const rW = 196, rH = 270;
      const rX = W - rW - 44, rY = H - rH - 220;
      ctx.save();
      drawRoundedRect(ctx, rX, rY, rW, rH, 16);
      ctx.fillStyle = 'rgba(5, 12, 26, 0.74)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(54, 232, 255, 0.55)';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Radar header
      ctx.fillStyle = '#36E8FF';
      ctx.font = '800 16px ui-monospace, Consolas, monospace';
      ctx.textAlign = 'center';
      ctx.fillText('LIDAR RADAR', rX + rW / 2, rY + 22);

      // Lane grid lines
      ctx.strokeStyle = 'rgba(54, 232, 255, 0.18)';
      ctx.lineWidth = 1.5;
      for (let l = 1; l < 6; l++) {
        const lx = rX + 18 + (l / 6) * (rW - 36);
        ctx.beginPath(); ctx.moveTo(lx, rY + 38); ctx.lineTo(lx, rY + rH - 18); ctx.stroke();
      }
      // Scanning sweep bar
      const sweepY = rY + 38 + ((t * 140) % (rH - 58));
      ctx.strokeStyle = 'rgba(54, 232, 255, 0.55)';
      ctx.beginPath(); ctx.moveTo(rX + 14, sweepY); ctx.lineTo(rX + rW - 14, sweepY); ctx.stroke();

      const mapRadar = (wx, wz) => ({
        x: rX + rW * 0.5 + (wx / (ROAD_W * 0.52)) * (rW * 0.42),
        y: rY + rH * 0.68 + (wz / 55) * (rH * 0.55),
      });

      // Plot traffic blips
      for (const tr of trafficList) {
        const z = tr.mesh.position.z;
        if (z > -65 && z < 28) {
          const rp = mapRadar(tr.mesh.position.x, z);
          ctx.fillStyle = tr.oncoming ? '#FFB84D' : '#36E8FF';
          ctx.fillRect(rp.x - 4, rp.y - 6, 8, 12);
        }
      }
      // Plot police blips (pulsing red/blue)
      for (const pp of [p1Pos, p2Pos]) {
        const rp = mapRadar(pp.x, pp.z);
        ctx.fillStyle = blink ? '#FF2A4D' : '#268BFF';
        ctx.beginPath(); ctx.arc(rp.x, rp.y, 6.5, 0, Math.PI * 2); ctx.fill();
      }
      // Plot hero gold chevron
      const hp = mapRadar(heroPos.x, 0);
      ctx.fillStyle = '#F2B45A';
      ctx.beginPath();
      ctx.moveTo(hp.x, hp.y - 10);
      ctx.lineTo(hp.x - 7, hp.y + 8);
      ctx.lineTo(hp.x + 7, hp.y + 8);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      // --- E) Bottom-Left Live Telemetry Feed & Waveform ---
      const fX = 44, fY = H - 350, fW = 310, fH = 130;
      ctx.save();
      drawRoundedRect(ctx, fX, fY, fW, fH, 14);
      ctx.fillStyle = 'rgba(5, 12, 26, 0.72)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(242, 180, 90, 0.45)';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.textAlign = 'left';
      ctx.font = '800 16px ui-monospace, Consolas, monospace';
      ctx.fillStyle = '#F2B45A';
      ctx.fillText('NEURAL PATH TELEMETRY', fX + 16, fY + 24);
      ctx.fillStyle = '#C8EAFF';
      ctx.font = '700 17px ui-monospace, Consolas, monospace';
      ctx.fillText(`VEL: ${kmh.toFixed(1)} KM/H  G:${gForce}`, fX + 16, fY + 52);
      ctx.fillStyle = nearestDist < 30 ? '#FF4466' : '#45FFBC';
      ctx.fillText(nearestDist < 30 ? `ALERT: GAP ${nearestDist.toFixed(1)}m` : `PATH: OPTIMAL LANE`, fX + 16, fY + 76);

      // Live scrolling oscilloscope waveform
      ctx.strokeStyle = '#36E8FF';
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      for (let i = 0; i < 46; i++) {
        const px = fX + 16 + i * 6;
        const amp = 8 + Math.abs(vx) * 2.2;
        const py = fY + 106 + Math.sin(t * 18 + i * 0.55) * amp * Math.sin(i * 0.14);
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
      ctx.restore();

      ctx.restore();
    }

    function updateOverlay(t, telemetry) {
      const whiteStart = 26.2;
      const whiteFull = 27.55;
      const activeBeat = SHORTS_CAPTIONS ? SHORTS_BEATS.find((b) => t >= b.t0 && t <= b.t1) : null;
      const showWhite = t >= whiteStart;
      const showHud = SHORTS_CAPTIONS && t >= 0.15 && t < 26.9;

      if (!activeBeat && !showWhite && !showHud) {
        endPlane.visible = false;
        return;
      }
      endPlane.visible = true;

      const dist = 0.15;
      const h = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) * 0.5) * dist;
      const w = h * camera.aspect;
      endPlane.position.set(0, 0, -dist);
      endPlane.scale.set(w * 1.02, h * 1.02, 1);

      const W = endCanvas.width, H = endCanvas.height;
      endCtx.clearRect(0, 0, W, H);

      // 0) Real-time 3D-tracked Tactical AR Motion Graphics HUD
      if (showHud && telemetry) {
        drawTacticalHUD(endCtx, t, telemetry, W, H);
      }

      // 1) Upper-safe YouTube Shorts Hook / Twist Caption Card
      if (activeBeat && !showWhite) {
        const fadeIn = smoothstep(activeBeat.t0, activeBeat.t0 + 0.28, t);
        const fadeOut = 1 - smoothstep(activeBeat.t1 - 0.3, activeBeat.t1, t);
        const alpha = clamp(fadeIn * fadeOut, 0, 1);
        const slideY = lerp(24, 0, fadeIn);

        endCtx.save();
        endCtx.globalAlpha = alpha;
        endCtx.translate(W * 0.5, 270 + slideY);

        drawRoundedRect(endCtx, -460, -96, 920, 206, 26);
        endCtx.fillStyle = 'rgba(6, 12, 26, 0.74)';
        endCtx.fill();
        endCtx.strokeStyle = 'rgba(242, 180, 90, 0.62)';
        endCtx.lineWidth = 3;
        endCtx.stroke();

        endCtx.fillStyle = '#F2B45A';
        endCtx.font = '800 24px "Segoe UI", ui-sans-serif, Arial, sans-serif';
        endCtx.textAlign = 'center';
        endCtx.textBaseline = 'middle';
        endCtx.fillText(activeBeat.badge, 0, -54);

        endCtx.fillStyle = '#FFFFFF';
        endCtx.font = '900 54px "Malgun Gothic", "Apple SD Gothic Neo", "Segoe UI", sans-serif';
        endCtx.fillText(activeBeat.main, 0, 8);

        endCtx.fillStyle = '#8BE8FF';
        endCtx.font = '700 30px "Malgun Gothic", "Apple SD Gothic Neo", "Segoe UI", sans-serif';
        endCtx.fillText(activeBeat.sub, 0, 66);

        endCtx.restore();
      }

      // 2) Windshield Whiteout + AI BUILD MASTER Ending (26.2s ~ 30.0s)
      if (showWhite) {
        const whiteP = smootherstep(whiteStart, whiteFull, t);
        const titleP = smootherstep(27.55, 28.45, t);
        const lineP = smootherstep(27.45, 28.25, t);
        const subP = smootherstep(28.05, 28.75, t);
        const sheenP = clamp((t - 28.35) / 1.15, 0, 1);

        const rad = lerp(W * 0.15, H * 1.15, whiteP);
        const grad = endCtx.createRadialGradient(W * 0.5, H * 0.48, rad * 0.15, W * 0.5, H * 0.48, rad);
        grad.addColorStop(0, `rgba(255,255,255,${clamp(whiteP * 1.25, 0, 1)})`);
        grad.addColorStop(0.65, `rgba(248,251,255,${clamp(whiteP * 1.05, 0, 1)})`);
        grad.addColorStop(1, `rgba(240,247,255,${clamp((whiteP - 0.35) / 0.65, 0, 1)})`);
        endCtx.fillStyle = grad;
        endCtx.fillRect(0, 0, W, H);

        if (whiteP > 0.7) {
          const gridA = (whiteP - 0.7) / 0.3 * 0.055;
          endCtx.strokeStyle = `rgba(14, 28, 56, ${gridA})`;
          endCtx.lineWidth = 2;
          for (let gx = 90; gx < W; gx += 180) { endCtx.beginPath(); endCtx.moveTo(gx, 0); endCtx.lineTo(gx, H); endCtx.stroke(); }
          for (let gy = 160; gy < H; gy += 180) { endCtx.beginPath(); endCtx.moveTo(0, gy); endCtx.lineTo(W, gy); endCtx.stroke(); }
        }

        if (titleP > 0.01) {
          endCtx.save();
          const scale = lerp(1.09, 1.0, titleP);
          endCtx.translate(W * 0.5, H * 0.47);
          endCtx.scale(scale, scale);

          endCtx.globalAlpha = subP;
          endCtx.fillStyle = '#D6892A';
          endCtx.font = '700 28px "Segoe UI", ui-sans-serif, Arial, sans-serif';
          endCtx.textAlign = 'center';
          endCtx.textBaseline = 'middle';
          endCtx.fillText('C O N N E C T   A I   L A B', 0, -148);

          const barW = 460 * lineP;
          const barGrad = endCtx.createLinearGradient(-barW / 2, 0, barW / 2, 0);
          barGrad.addColorStop(0, 'rgba(214,137,42,0)');
          barGrad.addColorStop(0.5, '#D6892A');
          barGrad.addColorStop(1, 'rgba(214,137,42,0)');
          endCtx.globalAlpha = lineP;
          endCtx.fillStyle = barGrad;
          endCtx.fillRect(-barW / 2, -98, barW, 4);

          endCtx.globalAlpha = titleP;
          endCtx.fillStyle = '#0A1324';
          endCtx.font = '900 94px "Segoe UI", "Arial Black", ui-sans-serif, sans-serif';
          endCtx.fillText('AI BUILD MASTER', 0, -4);

          if (sheenP > 0 && sheenP < 1) {
            const sx = lerp(-460, 460, sheenP);
            const sheenGrad = endCtx.createLinearGradient(sx - 120, -60, sx + 120, 60);
            sheenGrad.addColorStop(0, 'rgba(242,180,90,0)');
            sheenGrad.addColorStop(0.5, 'rgba(242,180,90,0.85)');
            sheenGrad.addColorStop(1, 'rgba(242,180,90,0)');
            endCtx.fillStyle = sheenGrad;
            endCtx.fillText('AI BUILD MASTER', 0, -4);
          }

          const b2W = 540 * lineP;
          endCtx.fillStyle = '#D6892A';
          endCtx.fillRect(-b2W / 2, 74, b2W, 7);

          endCtx.globalAlpha = subP * 0.85;
          endCtx.fillStyle = '#24344D';
          endCtx.font = '600 32px "Segoe UI", ui-sans-serif, Arial, sans-serif';
          endCtx.fillText('BUILD THE FUTURE WITH AI', 0, 140);

          endCtx.restore();
        }
      }

      endTex.needsUpdate = true;
    }

    // ---------- Hero Path & Choreography ----------
    function heroLaneAt(t) {
      const w1 = Math.sin(t * 0.72) * 3.0;
      const w2 = Math.sin(t * 1.48 + 0.9) * 1.8;
      const w3 = Math.sin(t * 2.35 - 0.5) * 0.75 * smoothstep(16.0, 18.0, t);
      const centerBias = 1.4;
      const endSettle = 1 - smoothstep(25.2, 26.6, t) * 0.7;
      return clamp((centerBias + (w1 + w2 + w3) * endSettle), -4.2, 7.2);
    }

    function heroSpeedAt(t) {
      if (t < 13.0) return lerp(68, 78, t / 13.0);
      if (t < 16.0) return lerp(78, 84, (t - 13.0) / 3.0);
      return lerp(84, 96, smoothstep(16.0, 26.8, t));
    }

    function heroDistanceAt(t) {
      let dist = 0;
      const steps = 120;
      const h = t / steps;
      for (let i = 0; i < steps; i++) dist += heroSpeedAt((i + 0.5) * h) * h;
      return dist;
    }

    const camPosTarget = new THREE.Vector3();
    const camLookTarget = new THREE.Vector3();
    let freeOrbit = false;

    function updateScene(tRaw) {
      const t = clamp(tRaw, 0, DURATION);
      const dtEps = 0.04;
      const heroX = heroLaneAt(t);
      const heroXNext = heroLaneAt(t + dtEps);
      const vx = (heroXNext - heroX) / dtEps;
      const speed = heroSpeedAt(t);
      const dist = heroDistanceAt(t);
      const kmh = speed * 3.6;

      cityRoot.position.z = dist % LOOP_LEN;
      roadTex.offset.y = -(dist / 40);

      hero.root.position.set(heroX, 0, 0);
      hero.root.rotation.set(0, clamp(-vx * 0.022, -0.26, 0.26), clamp(vx * 0.011, -0.10, 0.10));

      const wheelAngle = -dist / 0.36;
      for (const w of hero.wheels) w.rotation.x = wheelAngle;
      hero.wheelPivot.rotation.z = clamp(-vx * 0.16, -0.85, 0.85);

      const insideCockpit = t >= 15.0;
      hero.exteriorShell.visible = !insideCockpit;
      hero.cockpit.visible = insideCockpit;
      hero.trailL.visible = !insideCockpit;
      hero.trailR.visible = !insideCockpit;

      const strobeFlip = Math.floor(t * 11) % 2 === 0;
      const gear = kmh < 258 ? 5 : (kmh < 300 ? 6 : 7);
      const rpmRatio = clamp(((kmh - 210) % 52) / 52 * 0.45 + 0.52, 0.3, 0.98);
      if (insideCockpit) hero.updateHUD(kmh, gear, rpmRatio, strobeFlip);
      hero.mirrorGlassMat.color.setHex(strobeFlip ? 0xff2848 : 0x2088ff);
      hero.shiftLed.material.color.setHex(rpmRatio > 0.85 ? 0xff2848 : 0x30f2ff);

      // Police Interceptors tightly trailing so they stay clearly framed behind hero!
      const p1X = lerp(heroLaneAt(Math.max(0, t - 0.5)) - 2.4, heroX - 2.1, 0.35);
      const p1Z = 8.8 + Math.sin(t * 1.1) * 1.8 + smoothstep(15.5, 22.0, t) * 4.5;
      police1.root.position.set(clamp(p1X, -5.0, 8.5), 0, p1Z);
      police1.root.rotation.y = clamp(-(heroLaneAt(Math.max(0, t - 0.4)) - p1X) * 0.06, -0.2, 0.2);

      const p2X = lerp(heroLaneAt(Math.max(0, t - 0.8)) + 2.6, heroX + 2.4, 0.3);
      const p2Z = 13.8 + Math.cos(t * 0.9) * 2.2 + smoothstep(15.5, 22.0, t) * 3.0;
      police2.root.position.set(clamp(p2X, -5.0, 9.2), 0, p2Z);
      police2.root.rotation.y = clamp(-(heroLaneAt(Math.max(0, t - 0.7)) - p2X) * 0.05, -0.2, 0.2);

      police1.redBarMat.color.setHex(strobeFlip ? 0xff1535 : 0x3a050d);
      police1.blueBarMat.color.setHex(strobeFlip ? 0x081e42 : 0x1a8cff);
      police1.redHalo.visible = strobeFlip;
      police1.blueHalo.visible = !strobeFlip;

      police2.redBarMat.color.setHex(strobeFlip ? 0x3a050d : 0xff1535);
      police2.blueBarMat.color.setHex(strobeFlip ? 0x1a8cff : 0x081e42);
      police2.redHalo.visible = !strobeFlip;
      police2.blueHalo.visible = strobeFlip;

      strobeRed.position.set(police1.root.position.x - 0.5, 2.4, police1.root.position.z - 1.2);
      strobeBlue.position.set(police2.root.position.x + 0.5, 2.4, police2.root.position.z - 1.8);
      strobeRed.intensity = strobeFlip ? 32 : 5;
      strobeBlue.intensity = strobeFlip ? 5 : 32;

      for (const tr of trafficList) {
        const relDist = (dist - tr.speed * t);
        let z = ((tr.z0 + relDist) % 420);
        if (z > 45) z -= 420;
        if (z < -375) z += 420;
        let tx = tr.laneX;
        if (!tr.oncoming && Math.abs(z) < 7.5 && Math.abs(tx - heroX) < 2.6) {
          tx += (tx >= heroX ? 2.6 : -2.6);
        }
        tr.mesh.position.set(tx, 0, z);
      }

      for (let i = 0; i < STREAK_COUNT; i++) {
        const s = streaks[i];
        const z = ((s.zOff + dist * 1.45 * s.spd) % 120) - 105;
        dummy.position.set(s.x, s.y, z);
        dummy.scale.set(1, 1, lerp(0.85, 2.2, smoothstep(13, 25, t)));
        dummy.rotation.set(0, 0, 0);
        dummy.updateMatrix();
        streakMesh.setMatrixAt(i, dummy.matrix);
      }
      streakMesh.instanceMatrix.needsUpdate = true;

      const driftStrength = clamp((Math.abs(vx) - 2.0) / 3.6, 0, 1);
      sparkMesh.visible = driftStrength > 0.05 && !insideCockpit;
      if (sparkMesh.visible) {
        for (let i = 0; i < SPARK_COUNT; i++) {
          const sp = sparks[i];
          const life = (t * 3.8 + sp.phase) % 1;
          const sc = (1 - life) * driftStrength;
          dummy.position.set(heroX + sp.side * 0.96 + sp.vx * life, Math.max(0.06, 0.16 + sp.vy * life - 3.6 * life * life), 1.65 + sp.vz * life);
          dummy.scale.set(sc, sc, sc * 1.7);
          dummy.rotation.set(0, 0, 0);
          dummy.updateMatrix();
          sparkMesh.setMatrixAt(i, dummy.matrix);
        }
        sparkMesh.instanceMatrix.needsUpdate = true;
      }

      skyDome.position.set(heroX * 0.2, 0, 0);
      horizonGlow.position.set(heroX * 0.3, 24, -290);

      // ---------- 4-Act Cinematic Camera Choreography (tuned for 9:16 portrait!) ----------
      if (!freeOrbit && !renderer.xr.isPresenting) {
        const droneAngle = Math.sin(t * 0.45) * 0.48;
        const droneDist = lerp(22.0, 15.5, smoothstep(0, 12.5, t)) + Math.sin(t * 0.65) * 2.0;
        const droneHeight = lerp(12.2, 5.8, smoothstep(0, 10.5, t)) + Math.sin(t * 0.85) * 1.4;
        const dronePos = new THREE.Vector3(
          heroX + Math.sin(droneAngle) * droneDist * 0.58,
          droneHeight,
          Math.cos(droneAngle) * droneDist * 0.95 + 4.0
        );
        const droneLook = new THREE.Vector3(heroX, 1.35, -3.5);

        // Driver POV pulled slightly back so A-pillars, mirror, dash & wheel frame crisply!
        const cockpitLocalEye = new THREE.Vector3(-0.34, 1.18, 0.24);
        const cockpitLocalLook = new THREE.Vector3(-0.22 + vx * 0.04, 1.02, -22.0);
        hero.root.updateMatrixWorld(true);
        const driverPos = cockpitLocalEye.clone().applyMatrix4(hero.root.matrixWorld);
        const driverLook = cockpitLocalLook.clone().applyMatrix4(hero.root.matrixWorld);

        if (t < 13.0) {
          camPosTarget.copy(dronePos);
          camLookTarget.copy(droneLook);
          camera.fov = lerp(58, 66, smoothstep(0, 13.0, t));
          camera.position.copy(camPosTarget);
          camera.lookAt(camLookTarget);
          camera.rotation.z += clamp(-vx * 0.032 + Math.cos(t * 0.55) * 0.08, -0.22, 0.22);
        } else if (t < 16.0) {
          const u = smootherstep(13.0, 16.0, t);
          const arcLift = Math.sin(u * Math.PI) * 1.15;
          camPosTarget.lerpVectors(dronePos, driverPos, u);
          camPosTarget.y += arcLift * (1 - u);
          camLookTarget.lerpVectors(droneLook, driverLook, smootherstep(13.0, 15.8, t));
          const diveRush = Math.sin(u * Math.PI);
          camera.fov = lerp(66, 74, u) + diveRush * 16;
          camera.position.copy(camPosTarget);
          camera.lookAt(camLookTarget);
          camera.rotation.z += (1 - u) * Math.sin(u * Math.PI) * -0.18;
        } else {
          const rumbleAmt = lerp(0.012, 0.028, smoothstep(16.0, 26.2, t)) * (1 - smoothstep(26.5, 27.6, t));
          const shakeX = (Math.sin(t * 47.3) + Math.cos(t * 71.1)) * 0.5 * rumbleAmt;
          const shakeY = (Math.cos(t * 59.7) + Math.sin(t * 83.2)) * 0.5 * rumbleAmt;
          camera.position.copy(driverPos).add(new THREE.Vector3(shakeX, shakeY, 0));
          camera.lookAt(driverLook);
          camera.fov = lerp(74, 86, smoothstep(16.0, 26.5, t));
          camera.rotation.z += clamp(vx * 0.018, -0.12, 0.12);
        }
        camera.updateProjectionMatrix();
      }

      // Compute nearest obstacle ahead for live AR bracket & lidar telemetry
      let nearestObstacle = null;
      let nearestDist = 999;
      for (const tr of trafficList) {
        const z = tr.mesh.position.z;
        if (z < -4 && z > -95) {
          const d = tr.mesh.position.distanceTo(hero.root.position);
          if (d < nearestDist) { nearestDist = d; nearestObstacle = tr.mesh.position; }
        }
      }
      camera.updateMatrixWorld(true);
      updateOverlay(t, {
        kmh, vx, insideCockpit,
        heroPos: hero.root.position,
        p1Pos: police1.root.position,
        p2Pos: police2.root.position,
        nearestObstacle,
        nearestDist,
      });
    }

    // ---------- Interactive Playback UI ----------
    let simTime = 0;
    let playing = true;
    const ui = document.createElement('div');
    ui.className = 'abm-controls';
    const btnPlay = document.createElement('button'); btnPlay.className = 'abm-pill'; btnPlay.textContent = 'PAUSE';
    const btnReplay = document.createElement('button'); btnReplay.className = 'abm-pill'; btnReplay.textContent = 'REPLAY 30s';
    const btnCam = document.createElement('button'); btnCam.className = 'abm-pill'; btnCam.textContent = 'CAM: CINEMATIC';
    const timeLabel = document.createElement('span'); timeLabel.className = 'abm-time';
    ui.append(btnPlay, btnReplay, btnCam, timeLabel);
    document.body.appendChild(ui);

    btnPlay.onclick = () => { playing = !playing; btnPlay.textContent = playing ? 'PAUSE' : 'PLAY'; };
    btnReplay.onclick = () => { simTime = 0; playing = true; btnPlay.textContent = 'PAUSE'; };
    btnCam.onclick = () => { freeOrbit = !freeOrbit; controls.enabled = freeOrbit; btnCam.textContent = freeOrbit ? 'CAM: FREE ORBIT' : 'CAM: CINEMATIC'; };

    window.__capture = {
      duration: DURATION,
      width: CAP_W,
      height: CAP_H,
      renderAt(t) {
        updateScene(t);
        renderer.render(scene, camera);
        return renderer.domElement.toDataURL('image/jpeg', 0.93);
      },
      ready: true,
    };

    if (CAPTURE_MODE) {
      renderer.setAnimationLoop(null);
      updateScene(0);
      renderer.render(scene, camera);
      window.__xr.ready = true;
    } else {
      simTime = 4.2;
      updateScene(simTime);
      app.onFrame((dt) => {
        if (playing) { simTime += dt; if (simTime >= DURATION) simTime = 0; }
        updateScene(simTime);
        timeLabel.textContent = `${simTime.toFixed(1)}s / ${DURATION.toFixed(0)}s`;
      });
    }
  </script>
